name: Build and Test

on:
  pull_request:
    branches:
      - main # 検証対象のブランチ（必要に応じて変更）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14' # 使用するNode.jsのバージョン（必要に応じて変更）

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
